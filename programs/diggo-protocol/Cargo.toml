[package]
name = "diggo-protocol"
version = "0.1.0"
description = "Non-custodial Diggo.fun launch, mining, and equipment protocol"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "diggo_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", features = ["associated_token", "token_2022"] }
solana-hash = "4.5"
solana-slot-hashes = "3.1"
solana-sysvar = { version = "3.1", features = ["bytemuck"] }
solana-sysvar-id = "3.1"

# WS-G only. The integration suite in tests/ drives the built .so through LiteSVM and builds
# every instruction by hand against CONTRACTS.md, so it depends on no crate the program
# itself does not already ship in its own lock. Dev-only: build-sbf never sees these.
[dev-dependencies]
litesvm = "0.16"
sha2 = "0.10"
borsh = "1.5"
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
# The suite names the same solana-* crates LiteSVM 0.16 resolves, so the instruction and account
# types it builds are the ones the simulator's entrypoints expect. LiteSVM re-exports none of
# them, which is why they are named here rather than reached through it.
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-hash = "4.5"
solana-instruction = "3.4"
solana-instruction-error = "2.4"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-slot-hashes = "3.1"
solana-transaction = "4.1"
solana-transaction-error = "3.3"
